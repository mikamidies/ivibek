name: Deploy IvyBek Student App

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "DEPLOY_DIR=/var/www/ivybek/student.ivybek.com/prod" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "DEPLOY_DIR=/var/www/ivybek/student.ivybek.com/dev" >> $GITHUB_ENV
          fi

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u Dadamuhames \
            --password-stdin

      - name: Build and push image
        run: |
          docker build -t ghcr.io/dadamuhames/student.ivybek.com:${IMAGE_TAG} .
          docker push ghcr.io/dadamuhames/student.ivybek.com:${IMAGE_TAG}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          envs: GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u Dadamuhames --password-stdin
            cd ${{ env.DEPLOY_DIR }}
            docker compose pull --quiet
            docker compose up -d --force-recreate
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
