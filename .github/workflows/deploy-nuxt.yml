name: Deploy Nuxt App

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "DEPLOY_DIR=/var/www/nuxt/prod" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "DEPLOY_DIR=/var/www/nuxt/dev" >> $GITHUB_ENV
          fi

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u Dadamuhames \
            --password-stdin

      - name: Build image
        run: |
          docker build -t ghcr.io/dadamuhames/student.ivybek.com:${IMAGE_TAG} .

      - name: Push image
        run: |
          docker push ghcr.io/dadamuhames/student.ivybek.com:${IMAGE_TAG}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          script: |
            set -e
            cd $DEPLOY_DIR
            docker compose pull
            docker compose up -d
            docker image prune -f
